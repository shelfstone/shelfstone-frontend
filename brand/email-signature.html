<!--
  George's email signature, in the site's catalog style. Paste this into the mail client's
  signature editor in HTML mode. Tables and inline styles only, and no images: the logo bars are
  coloured table cells, so the signature never shows a blocked or broken picture.
  Update the "Now buying" line when the wanted list changes.
-->
<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  role="presentation"
  style="
    border-collapse: collapse;
    font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
    color: #111214;
    max-width: 460px;
  "
>
  <tr>
    <td style="border-top: 2px solid #111214; padding: 12px 0 0 0">
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        role="presentation"
        style="border-collapse: collapse"
      >
        <tr>
          <td valign="middle" style="padding: 0 9px 0 0">
            <table
              cellpadding="0"
              cellspacing="0"
              border="0"
              role="presentation"
              style="border-collapse: collapse"
            >
              <tr>
                <td
                  width="11"
                  height="4"
                  style="
                    width: 11px;
                    height: 4px;
                    background-color: #005eb8;
                    font-size: 0;
                    line-height: 0;
                  "
                >
                  &nbsp;
                </td>
                <td width="9" style="width: 9px; font-size: 0; line-height: 0">&nbsp;</td>
              </tr>
              <tr>
                <td colspan="2" height="2" style="height: 2px; font-size: 0; line-height: 0">
                  &nbsp;
                </td>
              </tr>
              <tr>
                <td
                  colspan="2"
                  width="20"
                  height="4"
                  style="
                    width: 20px;
                    height: 4px;
                    background-color: #111214;
                    font-size: 0;
                    line-height: 0;
                  "
                >
                  &nbsp;
                </td>
              </tr>
              <tr>
                <td colspan="2" height="2" style="height: 2px; font-size: 0; line-height: 0">
                  &nbsp;
                </td>
              </tr>
              <tr>
                <td
                  colspan="2"
                  width="20"
                  height="4"
                  style="
                    width: 20px;
                    height: 4px;
                    background-color: #111214;
                    font-size: 0;
                    line-height: 0;
                  "
                >
                  &nbsp;
                </td>
              </tr>
            </table>
          </td>
          <td
            valign="middle"
            style="
              font-size: 13px;
              font-weight: 800;
              letter-spacing: 3px;
              text-transform: uppercase;
              color: #111214;
            "
          >
            Shelfstone
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td
      style="
        padding: 12px 0 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        color: #111214;
      "
    >
      George <span style="font-size: 13px; font-weight: 400; color: #5a5f66">&middot; Founder</span>
    </td>
  </tr>
  <tr>
    <td style="padding: 3px 0 0 0; font-size: 13px; line-height: 1.4; color: #2f3236">
      Buyer of US-market consumer goods &middot; matched by UPC
    </td>
  </tr>
  <tr>
    <td style="padding: 8px 0 10px 0; font-size: 13px; line-height: 1.4">
      <a
        href="mailto:george@shelfstone.com"
        style="color: #005eb8; text-decoration: none; font-weight: 700"
        >george@shelfstone.com</a
      >
      <span style="color: #c9cdd2">&nbsp;|&nbsp;</span>
      <a

        style="color: #005eb8; text-decoration: none; font-weight: 700"
