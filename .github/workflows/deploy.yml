name: Deploy to GitHub Pages

# Checks run in ci.yml; this workflow only builds and publishes main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served from /website/ on github.io. With a custom domain, set the repository
      # variable BASE_PATH to "/".
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/website/' }}

      # GitHub Pages shows 404.html for unknown paths; serving the app there lets
      # direct visits to /wanted and /privacy load the right page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
